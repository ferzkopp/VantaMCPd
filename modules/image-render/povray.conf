; VantaMCPd image-render POV-Ray I/O policy. Bound read-only over /etc/povray/3.7/povray.conf
; inside the render sandbox, replacing Debian's default policy.

[File I/O Security]
restricted

[Shellout Security]
forbidden

[Permitted Paths]
read* = /usr/share/povray-3.7
read* = /usr/share/fonts/truetype/povray
read* = /vanta-library
read* = /inputs
read+write* = /work
